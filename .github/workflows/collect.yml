name: LARRYFIT crowd collection and website

on:
  workflow_dispatch:
  schedule:
    # Japanese local time, 4 times daily
    - cron: '17 3,9,15,21 * * *'
      timezone: 'Asia/Tokyo'

concurrency:
  group: larryfit-crowd-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run existing tests
        run: python -m unittest discover -s tests -v
      - name: Install browser tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect Popular Times using browser
        run: python collector_browser.py
      - name: Upload diagnostic screenshot on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: browser_diagnostics/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Update LARRYFIT popular times"
            git push
          fi
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/latest.json data/history.jsonl _site/data/
          touch _site/.nojekyll
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
